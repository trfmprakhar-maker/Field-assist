<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1c17">
<title>Sharda Field — Sales &amp; Distribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#0f1c17; --rail2:#1a2e25; --railtx:#8ba79a;
  --bg:#f2f1ec; --card:#fff; --line:#dedbd2; --line2:#ecebe4;
  --ink:#15201c; --ink2:#4a5852; --ink3:#82908a;
  --green:#0e6b4c; --greenD:#0a5139; --greenL:#e6f1eb;
  --gold:#a8760c; --goldL:#f9f0d9;
  --red:#a32e22; --redL:#fbe9e6;
  --clay:#7a5c3e;
  --rail-w:214px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:Archivo,Inter,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

/* ---------------- login ---------------- */
#login{position:fixed;inset:0;z-index:200;background:var(--rail);color:#eef2ef;overflow-y:auto;padding:28px 18px calc(28px + var(--safe))}
#login .wrap{max-width:430px;margin:0 auto}
#login .lg{font-family:Archivo;font-weight:800;font-size:30px;letter-spacing:-.035em;line-height:1}
#login .lg em{font-style:normal;color:#5fbf95}
#login .sub{color:var(--railtx);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}
#login .grp{margin-top:26px}
#login .grp h4{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5c7a6d;margin-bottom:8px}
.ucard{display:flex;align-items:center;gap:12px;background:var(--rail2);border:1px solid #24382e;border-radius:11px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.ucard:hover{border-color:var(--green);background:#1e3529}
.av{width:38px;height:38px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Archivo;font-weight:700;font-size:14px;flex-shrink:0}
.av.b{background:#3b5a4a} .av.c{background:var(--clay)} .av.d{background:#2e4f66}
.ucard b{display:block;font-size:14.5px;font-weight:600}
.ucard span{font-size:12px;color:var(--railtx)}

/* ---------------- shell ---------------- */
#app{display:none}
#app.on{display:block}
.rail{display:none}
.topbar{position:sticky;top:0;z-index:60;background:var(--rail);color:#eef2ef;display:flex;align-items:center;gap:10px;padding:9px 13px}
.topbar .tt{min-width:0;flex:1}
.topbar .tt b{font-family:Archivo;font-weight:700;font-size:16px;display:block;letter-spacing:-.02em}
.topbar .tt span{font-size:11px;color:var(--railtx)}
.syncchip{border:1px solid #24382e;background:var(--rail2);color:var(--railtx);border-radius:999px;
  padding:5px 11px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.syncchip.ok{color:#5fbf95;border-color:#2c5a45}
.syncchip.wait,.syncchip.busy{color:#d9b45c;border-color:#4d4326}
.syncchip.err{color:#e39a8f;border-color:#5c3630}
@media(max-width:520px){.syncchip{display:none}}
.who{display:flex;align-items:center;gap:8px;background:var(--rail2);border:1px solid #24382e;border-radius:999px;padding:4px 5px 4px 11px;cursor:pointer}
.who b{font-size:12px;font-weight:600;white-space:nowrap}
.who .av{width:26px;height:26px;border-radius:7px;font-size:11px}
main{max-width:1240px;margin:0 auto;padding:13px 13px calc(78px + var(--safe))}

/* ---------------- module head ---------------- */
.mh{display:flex;align-items:flex-end;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.mh h2{font-size:21px;font-weight:700}
.eyebrow{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:3px}
.mh .right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px}
.filters select,.filters input{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;flex:0 0 auto}

/* ---------------- primitives ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:13px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.ch{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ch b{font-family:Archivo;font-size:13px;font-weight:700}
.ch .right{margin-left:auto;display:flex;gap:6px}

.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#000}
.btn.g{background:var(--green);border-color:var(--green)}.btn.g:hover{background:var(--greenD)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--line2)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.wide{width:100%;padding:13px;font-size:15px}
.btn:disabled{opacity:.42;cursor:not-allowed}

.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.g{background:var(--greenL);color:var(--greenD)}
.tag.r{background:var(--redL);color:var(--red)}
.tag.y{background:var(--goldL);color:var(--gold)}
.tag.b{background:#e7eef3;color:#2e4f66}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:default}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--green)}
.kpi .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.kpi .v{font-family:"IBM Plex Mono";font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:5px;line-height:1.05}
.kpi .v small{font-size:13px;color:var(--ink3);font-weight:500}
.kpi .s{font-size:11px;color:var(--ink3);margin-top:5px}
.kpi.acc{border-left:3px solid var(--green)}
.kpi.warn{border-left:3px solid var(--gold)}
.kpi.bad{border-left:3px solid var(--red)}
.up{color:var(--green);font-weight:600}.down{color:var(--red);font-weight:600}

.bar{height:6px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.bar i.mid{background:var(--gold)} .bar i.low{background:var(--red)} .bar i.clay{background:var(--clay)}

.row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.row .r{text-align:right;flex-shrink:0}
.row.click{cursor:pointer}.row.click:hover{background:#faf9f6}
.stripe{width:3px;align-self:stretch;margin:-11px 8px -11px -14px;background:var(--line2);flex-shrink:0}
.stripe.ok{background:var(--green)}.stripe.no{background:var(--red)}.stripe.due{background:var(--gold)}.stripe.miss{background:var(--line)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);font-weight:700;
  padding:9px 11px;background:#f8f7f3;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#faf9f6}
.tbl .n{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
.tbl th.n{font-family:Inter}
.tbl .sub{font-size:11px;color:var(--ink3)}
.tbl tr.clickable{cursor:pointer}

.f{margin-bottom:11px}
.f label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px}
.f input:focus,.f select:focus{border-color:var(--green);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;padding:34px 16px;color:var(--ink3)}
.empty b{display:block;font-family:Archivo;font-size:15px;color:var(--ink2);margin-bottom:5px}
.muted{color:var(--ink3);font-size:11.5px}
.note{background:var(--goldL);border:1px solid #e8d9a8;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.note.bad{background:var(--redL);border-color:#eecac4;color:#7d2419}

/* ---------------- beat day chips ---------------- */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.day{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;text-align:center;cursor:pointer;min-width:56px}
.day.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.day b{display:block;font-family:Archivo;font-size:13px}
.day span{font-size:10px;color:var(--ink3)}.day.on span{color:#9db3aa}

/* ---------------- punch ---------------- */
.punch{background:var(--rail);color:#eef2ef;border-radius:12px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:13px}
.punch .m{flex:1;min-width:0}
.punch .l{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--railtx)}
.punch .v{font-family:Archivo;font-size:17px;font-weight:700;margin-top:2px}
.punch .sub{font-size:11.5px;color:var(--railtx);margin-top:3px}

/* ---------------- journey calendar (signature) ---------------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .hd{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:center;padding:4px 0}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;display:flex;flex-direction:column;gap:2px;min-height:52px}
.cell.sun{background:#f6f5f1;border-style:dashed}
.cell.fut{opacity:.45}
.cell .dd{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--ink3);font-weight:500}
.cell .pb{margin-top:auto;display:flex;gap:2px;align-items:flex-end;height:22px}
.cell .pb i{flex:1;background:var(--line2);border-radius:1px;align-self:stretch;position:relative;overflow:hidden}
.cell .pb i b{position:absolute;left:0;right:0;bottom:0;display:block;background:var(--green)}
.cell .pb i.dev b{background:var(--gold)}
.cell.today{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.cell .mini{font-family:"IBM Plex Mono";font-size:9px;color:var(--ink2);line-height:1}

/* ---------------- order lines ---------------- */
.ol{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.ol:last-child{border-bottom:0}
.ol .m{flex:1;min-width:0}
.ol .t{font-weight:600;font-size:13.5px}
.ol .s{font-size:11px;color:var(--ink3)}
.ol .sch{font-size:10.5px;color:var(--greenD);font-weight:600;margin-top:2px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0;background:#fff}
.step button{width:33px;height:33px;border:0;background:#fff;font-size:17px;font-weight:600;cursor:pointer;color:var(--ink2)}
.step button:active{background:var(--line2)}
.step input{width:46px;height:33px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-family:"IBM Plex Mono";font-weight:600;font-size:15px}
.totbar{position:sticky;bottom:calc(72px + var(--safe));background:var(--rail);color:#fff;border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:12px;margin-top:12px;z-index:20}
.totbar .l{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--railtx)}
.totbar .v{font-family:"IBM Plex Mono";font-size:19px;font-weight:600}
.totbar .sv{font-size:11px;color:#5fbf95}
.totbar button{margin-left:auto}

/* ---------------- parchi ---------------- */
.parchi{background:#fffdf7;border:1px solid var(--line);border-radius:6px;padding:15px 15px 24px;position:relative;
  background-image:repeating-linear-gradient(transparent,transparent 25px,#f1ede1 25px,#f1ede1 26px);background-position:0 62px}
.parchi:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:9px;background:radial-gradient(circle at 5px -2px,transparent 5px,var(--bg) 5px);background-size:10px 10px}
.parchi .ph{display:flex;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:9px}
.parchi .ph b{font-family:Archivo;font-weight:800;font-size:15px}
.parchi .ph span{margin-left:auto;font-family:"IBM Plex Mono";font-size:10.5px;color:var(--ink2)}
.parchi .pl{display:flex;font-family:"IBM Plex Mono";font-size:12px;line-height:26px}
.parchi .pl .d{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.parchi .pl .q{width:52px;text-align:right}
.parchi .pl .a{width:76px;text-align:right}
.parchi .pl.free .d{color:var(--greenD)}
.parchi .pt{display:flex;font-family:"IBM Plex Mono";font-size:12px;line-height:24px;border-top:2px solid var(--ink);margin-top:5px;padding-top:6px}
.parchi .pt .a{width:76px;text-align:right;margin-left:auto}
.parchi .pt.big{font-weight:700;font-size:14px}
.stamp{position:absolute;right:16px;bottom:38px;transform:rotate(-11deg);border:2.5px solid var(--green);color:var(--green);
  border-radius:6px;padding:3px 9px;font-family:Archivo;font-weight:800;font-size:14px;letter-spacing:.09em;opacity:.8}

/* ---------------- sheet ---------------- */
.backdrop{position:fixed;inset:0;background:rgba(15,28,23,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:580px;max-height:93vh;overflow-y:auto;border-radius:15px 15px 0 0;padding:15px 15px calc(20px + var(--safe))}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:13px;position:sticky;top:-15px;background:var(--bg);padding:5px 0 8px;z-index:3}
.sheet-h h3{font-size:17px;font-weight:700;flex:1}
.x{border:0;background:var(--line2);width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe));z-index:150;background:var(--rail);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------------- bottom nav ---------------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:80;background:#fff;border-top:1px solid var(--line);display:flex;padding:5px 3px calc(5px + var(--safe))}
nav button{flex:1;border:0;background:transparent;cursor:pointer;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink3);border-radius:8px}
nav button b{font-size:10px;font-weight:600}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--greenD)}nav button.on svg{stroke-width:2.2}

/* ---------------- desktop rail ---------------- */
@media(min-width:900px){
  body{padding:0}
  nav{display:none}
  .rail{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);background:var(--rail);color:#eef2ef;z-index:70;overflow-y:auto;padding:14px 10px}
  .rail .lg{font-family:Archivo;font-weight:800;font-size:17px;letter-spacing:-.03em;padding:0 8px 3px}
  .rail .lg em{font-style:normal;color:#5fbf95}
  .rail .sub{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#5c7a6d;padding:0 8px 14px}
  .rail h5{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#54705f;margin:13px 8px 5px;font-weight:700}
  .rail a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;color:#b9cdc3;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none}
  .rail a:hover{background:var(--rail2);color:#fff}
  .rail a.on{background:var(--green);color:#fff;font-weight:600}
  .rail a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
  .rail .foot{margin-top:auto;padding-top:12px}
  #app.on{padding-left:var(--rail-w)}
  .topbar{padding:11px 20px}
  main{padding:16px 20px 40px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .totbar{bottom:16px}
  .cell{min-height:64px}
}
@media(min-width:1200px){ .kpis.k5{grid-template-columns:repeat(5,1fr)} }
@media print{ .rail,nav,.topbar,.btn,.no-print{display:none!important} body{background:#fff} #app.on{padding-left:0} }
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="login"></div>
<div id="app">
  <aside class="rail"></aside>
  <header class="topbar"></header>
  <main id="main"></main>
  <nav></nav>
</div>
<script>
/* ==================== storage ==================== */
const KEY='shardafield:v2';
const Store={
  async load(){
    try{ if(window.storage){ const r=await window.storage.get(KEY); return r?JSON.parse(r.value):null; } }catch(e){ if(window.storage) return null; }
    try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){}
    return null;
  },
  async save(d){
    const s=JSON.stringify(d);
    try{ if(window.storage){ await window.storage.set(KEY,s); return true; } }catch(e){}
    try{ localStorage.setItem(KEY,s); return true; }catch(e){}
    return false;
  }
};

/* ==================== helpers ==================== */
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const iso=d=>d.toISOString().slice(0,10);
const today=()=>iso(new Date());
const dayName=d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T00:00').getDay()];
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d);};
const dDiff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const monthOf=d=>d.slice(0,7);
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const inrS=n=>{n=Math.round(n||0);const s=n<0?'-':'';n=Math.abs(n);
  if(n>=1e7)return s+'₹'+(n/1e7).toFixed(2)+'Cr'; if(n>=1e5)return s+'₹'+(n/1e5).toFixed(2)+'L';
  if(n>=1000)return s+'₹'+(n/1000).toFixed(1)+'K'; return s+'₹'+n;};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(arr,id)=>(arr||[]).find(x=>x.id===id)||{};
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const fmtTime=t=>t?t.slice(11,16):'—';

/* ==================== seed ==================== */

/* ==================== schemes engine ==================== */
function applySchemes(lines,skus,schemes,date){
  const act=schemes.filter(s=>s.active&&(!s.from||s.from<=date)&&(!s.to||s.to>=date));
  const out=lines.map(l=>({...l,disc:0,free:0,scheme:null}));
  const applied=[];
  out.forEach(l=>{
    act.forEach(s=>{
      if(!s.skuIds||!s.skuIds.length||!s.skuIds.includes(l.skuId))return;
      if(s.type==='freegoods'&&l.qty>=s.min){
        const f=Math.floor(l.qty/s.min)*s.free;
        if(f>l.free){l.free=f;l.scheme=s.name;if(!applied.includes(s.name))applied.push(s.name);}
      }
      if(s.type==='qty'&&l.qty>=s.min){
        const d=Math.round(l.qty*l.rate*s.pct/100);
        if(d>l.disc){l.disc=d;l.scheme=s.name;if(!applied.includes(s.name))applied.push(s.name);}
      }
      if(s.type==='flat'){
        const d=Math.round(l.qty*l.rate*s.pct/100);
        if(d>l.disc){l.disc=d;l.scheme=s.name;if(!applied.includes(s.name))applied.push(s.name);}
      }
    });
  });
  const gross=out.reduce((a,l)=>a+l.qty*l.rate,0);
  let disc=out.reduce((a,l)=>a+l.disc,0);
  act.forEach(s=>{
    if(s.type==='value'&&gross>=s.min){
      disc+=Math.round(gross*s.pct/100);
      if(!applied.includes(s.name))applied.push(s.name);
    }
  });
  return {lines:out,gross,disc,net:gross-disc,applied};
}

/* ==================== scoping ==================== */
function scopeOf(DB,user){
  if(!user||user.role==='admin')return {men:DB.salesmen.map(m=>m.id),dists:DB.distributors.map(d=>d.id),outlets:DB.outlets.map(o=>o.id),all:true};
  if(user.role==='asm'){
    const men=DB.salesmen.filter(m=>m.asmId===user.ref).map(m=>m.id);
    const dists=DB.distributors.filter(d=>d.asmId===user.ref).map(d=>d.id);
    return {men,dists,outlets:DB.outlets.filter(o=>men.includes(o.salesmanId)).map(o=>o.id)};
  }
  if(user.role==='salesman')
    return {men:[user.ref],dists:[...new Set(DB.outlets.filter(o=>o.salesmanId===user.ref).map(o=>o.distId))],
            outlets:DB.outlets.filter(o=>o.salesmanId===user.ref).map(o=>o.id)};
  return {men:[...new Set(DB.outlets.filter(o=>o.distId===user.ref).map(o=>o.salesmanId))],dists:[user.ref],
          outlets:DB.outlets.filter(o=>o.distId===user.ref).map(o=>o.id)};
}

/* ==================== finance ==================== */
function outstanding(DB,filt){
  const buckets={b0:0,b15:0,b30:0,b60:0},list=[];
  DB.invoices.forEach(i=>{
    if(filt&&!filt(i))return;
    const bal=i.amount-i.paid; if(bal<=0)return;
    const age=dDiff(i.date,today());
    if(age<=15)buckets.b0+=bal; else if(age<=30)buckets.b15+=bal;
    else if(age<=60)buckets.b30+=bal; else buckets.b60+=bal;
    list.push({...i,bal,age,overdue:i.due<today()});
  });
  const total=buckets.b0+buckets.b15+buckets.b30+buckets.b60;
  return {buckets,total,list:list.sort((a,b)=>b.age-a.age)};
}
const outletDue=(DB,outletId)=>DB.invoices.filter(i=>i.outletId===outletId).reduce((a,i)=>a+(i.amount-i.paid),0);

/* ==================== stock ==================== */
function stockOf(DB,distId){
  const inQ={},outQ={};
  DB.primary.filter(p=>p.distId===distId).forEach(p=>p.lines.forEach(l=>inQ[l.skuId]=(inQ[l.skuId]||0)+l.qty));
  DB.orders.filter(o=>o.distId===distId).forEach(o=>o.lines.forEach(l=>outQ[l.skuId]=(outQ[l.skuId]||0)+l.qty+(l.free||0)));
  return DB.skus.map(s=>{
    const i=inQ[s.id]||0,o=outQ[s.id]||0,close=i-o;
    const l30=DB.orders.filter(x=>x.distId===distId&&x.date>=daysAgo(30))
      .reduce((a,x)=>a+x.lines.filter(l=>l.skuId===s.id).reduce((b,l)=>b+l.qty+(l.free||0),0),0);
    const rate=l30/30;
    return {sku:s,inQ:i,outQ:o,close,rate,cover:rate>0?close/rate:(close>0?99:0)};
  });
}

/* ==================== targets ==================== */
function targetProgress(DB,month,salesmanId){
  const t=DB.targets.find(x=>x.month===month&&x.salesmanId===salesmanId);
  const tgt=t?t.value:0;
  const ach=DB.orders.filter(o=>monthOf(o.date)===month&&o.salesmanId===salesmanId).reduce((a,o)=>a+o.total,0);
  const now=new Date(), first=new Date(now.getFullYear(),now.getMonth(),1);
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const gone=month===monthOf(today())?Math.max(1,Math.round((now-first)/864e5)+1):dim;
  const proj=Math.round(ach/gone*dim);
  return {tgt,ach,pc:pct(ach,tgt),proj,gone,dim,left:dim-gone,need:Math.max(0,tgt-ach),
    perDay:dim-gone>0?Math.max(0,tgt-ach)/(dim-gone):0};
}

/* ==================== attendance / pjp ==================== */
function attToday(DB,salesmanId){ return DB.attendance.find(a=>a.date===today()&&a.salesmanId===salesmanId)||null; }
function pjpFor(DB,salesmanId,date){
  const p=DB.pjp.find(x=>x.salesmanId===salesmanId&&x.date===date);
  if(p)return p.outletIds;
  return DB.outlets.filter(o=>o.salesmanId===salesmanId&&o.beat===dayName(date)).map(o=>o.id);
}
function pjpMonth(DB,salesmanId,month){
  const out=[];
  const [y,m]=month.split('-').map(Number);
  const dim=new Date(y,m,0).getDate();
  for(let i=1;i<=dim;i++){
    const date=`${y}-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    if(dayName(date)==='Sun'){out.push({date,sun:true,plan:0,done:0,dev:0});continue;}
    const plan=pjpFor(DB,salesmanId,date);
    const vs=DB.visits.filter(v=>v.date===date&&v.salesmanId===salesmanId);
    const done=vs.filter(v=>plan.includes(v.outletId)).length;
    const dev=vs.filter(v=>!plan.includes(v.outletId)).length;
    out.push({date,d:i,plan:plan.length,done,dev,future:date>today()});
  }
  return out;
}

/* ==================== claims ==================== */
function claims(DB,month){
  return DB.distributors.map(d=>{
    const os=DB.orders.filter(o=>o.distId===d.id&&monthOf(o.date)===month);
    const disc=os.reduce((a,o)=>a+(o.disc||0),0);
    const freeVal=os.reduce((a,o)=>a+o.lines.reduce((b,l)=>b+(l.free||0)*byId(DB.skus,l.skuId).ptd,0),0);
    return {dist:d,orders:os.length,disc,freeVal,total:disc+freeVal,
      gross:os.reduce((a,o)=>a+o.gross,0)};
  });
}
/* ==================== sync engine ====================
   Offline first. Every local write is recorded in an outbox; the outbox is
   flushed to the API when a connection is available, then changes from the
   server are pulled and merged. With no API configured the app behaves exactly
   as it did before — everything stays on the device.

   Doc types map to arrays on DB:
     outlet sku scheme salesman distributor asm target
     order visit invoice collection attendance primary
*/
const TYPE_LIST={outlet:'outlets',sku:'skus',scheme:'schemes',salesman:'salesmen',
  distributor:'distributors',asm:'asms',target:'targets',order:'orders',visit:'visits',
  invoice:'invoices',collection:'collections',attendance:'attendance',primary:'primary'};
const LIST_TYPE=Object.fromEntries(Object.entries(TYPE_LIST).map(([t,l])=>[l,t]));

const Sync={
  get cfg(){ return (DB&&DB.sync)||{url:'',token:'',user:null,last:0}; },
  set cfg(v){ DB.sync=v; },
  outbox(){ DB.outbox=DB.outbox||[]; return DB.outbox; },
  busy:false, lastError:null, online:true,

  configured(){ return !!(this.cfg.url&&this.cfg.token); },

  /** Record a local change so it reaches the server on the next flush. */
  track(type,obj,deleted){
    if(!obj||!obj.id)return obj;
    const ob=this.outbox();
    const i=ob.findIndex(o=>o.id===obj.id);
    const op={id:obj.id,type,data:obj,deleted:!!deleted};
    if(i>=0)ob[i]=op; else ob.push(op);
    return obj;
  },

  async call(path,opts){
    const c=this.cfg;
    const r=await fetch(c.url.replace(/\/$/,'')+path,{
      ...opts, headers:{'content-type':'application/json',
        ...(c.token?{authorization:'Bearer '+c.token}:{}) ,...(opts&&opts.headers||{})}});
    let body=null; try{ body=await r.json(); }catch(e){}
    if(!r.ok)throw new Error((body&&body.error)||('Server said '+r.status));
    return body;
  },

  async login(url,userId,pin){
    const base=url.replace(/\/$/,'');
    const r=await fetch(base+'/api/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({userId,pin})});
    const body=await r.json();
    if(!r.ok)throw new Error(body.error||'Sign in failed');
    this.cfg={url:base,token:body.token,user:body.user,last:0};
    await save();
    return body.user;
  },

  signOut(){ this.cfg={url:this.cfg.url,token:'',user:null,last:0}; save(); },

  /** Push the outbox, then pull anything newer than our watermark. */
  async run(silent){
    if(!this.configured()||this.busy)return;
    this.busy=true; this.lastError=null; paintSync();
    try{
      const ob=this.outbox();
      while(ob.length){
        const batch=ob.slice(0,200);
        await this.call('/api/push',{method:'POST',body:JSON.stringify({ops:batch})});
        ob.splice(0,batch.length);
        await save();
      }
      const res=await this.call('/api/pull?since='+(this.cfg.last||0));
      if(res.docs&&res.docs.length)this.merge(res.docs);
      const c=this.cfg; c.last=res.now; this.cfg=c;
      this.online=true;
      await save();
      if(!silent)toast('Synced');
      render();
    }catch(e){
      this.lastError=e.message;
      this.online=!/failed|network|fetch/i.test(e.message);
      if(!silent)toast(e.message);
      paintSync();
    }finally{ this.busy=false; paintSync(); }
  },

  /** Server wins on conflict — its updated_at is authoritative. */
  merge(docs){
    docs.forEach(d=>{
      const list=TYPE_LIST[d.type]; if(!list)return;
      DB[list]=DB[list]||[];
      const i=DB[list].findIndex(x=>x.id===d.id);
      if(d.deleted){ if(i>=0)DB[list].splice(i,1); return; }
      if(i>=0)DB[list][i]=d.data; else DB[list].push(d.data);
    });
  },

  /** One-time upload of everything currently on this device. */
  async seedServer(){
    const ops=[];
    Object.entries(TYPE_LIST).forEach(([type,list])=>
      (DB[list]||[]).forEach(o=>{ if(o&&o.id)ops.push({id:o.id,type,data:o,deleted:false}); }));
    let done=0;
    for(let i=0;i<ops.length;i+=200){
      await this.call('/api/push',{method:'POST',body:JSON.stringify({ops:ops.slice(i,i+200)})});
      done+=Math.min(200,ops.length-i);
      toast('Uploaded '+done+' of '+ops.length);
    }
    const res=await this.call('/api/pull?since=0');
    const c=this.cfg; c.last=res.now; this.cfg=c; await save();
    return ops.length;
  }
};

/** Shorthand used at every mutation site. */
function put(type,obj,deleted){ return Sync.track(type,obj,deleted); }

/* ---- status chip in the top bar ---- */
function syncState(){
  if(!Sync.configured())return {k:'off',t:'On this device'};
  if(Sync.busy)return {k:'busy',t:'Syncing…'};
  const n=(DB.outbox||[]).length;
  if(Sync.lastError)return {k:'err',t:n?n+' waiting':'Sync failed'};
  if(n)return {k:'wait',t:n+' waiting'};
  return {k:'ok',t:'Synced'};
}
function paintSync(){
  const el=document.getElementById('syncChip'); if(!el)return;
  const s=syncState();
  el.className='syncchip '+s.k;
  el.textContent=s.t;
}

/* ==================== attendance ==================== */
function vAtt(){
  const from=daysAgo(S.range);
  const men=S.me?myMen().filter(m=>m.id===S.me):myMen();
  const rows=men.map(m=>{
    const a=DB.attendance.filter(x=>x.salesmanId===m.id&&x.date>=from);
    const wd=workDays(from);
    const km=a.reduce((x,y)=>x+(y.km||0),0);
    const late=a.filter(x=>x.inTs.slice(11,16)>'09:30').length;
    const v=DB.visits.filter(x=>x.salesmanId===m.id&&x.date>=from);
    return {m,present:a.length,wd,km,late,calls:v.length,perDay:a.length?(v.length/a.length).toFixed(1):'0.0'};
  });
  const log=DB.attendance.filter(a=>sc().men.includes(a.salesmanId)&&(!S.me||a.salesmanId===S.me)&&a.date>=from)

  ${filterBar(['man','range'])}

    <thead><tr><th>Salesman</th><th class="n">Present</th><th class="n">Working days</th><th class="n">Late in</th>
      <th class="n">Calls/day</th><th class="n">Km</th><th>Attendance</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.m.name)}</b><div class="sub">${esc(r.m.area)}</div></td>
      <td class="n">${r.present}</td><td class="n">${r.wd}</td>
      <td class="n">${r.late?`<span class="tag y">${r.late}</span>`:'0'}</td>
      <td class="n">${r.perDay}</td><td class="n">${r.km}</td>
      <td style="min-width:110px"><div class="num" style="font-size:11px">${pct(r.present,r.wd)}%</div>
        <div class="bar"><i class="${pct(r.present,r.wd)<80?'low':pct(r.present,r.wd)<92?'mid':''}" style="width:${pct(r.present,r.wd)}%"></i></div></td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="card flush"><div class="ch"><b>Punch log</b><span class="tag">latest ${log.length}</span></div>
  <div class="scroll"><table class="tbl"><thead><tr><th>Date</th><th>Salesman</th><th>In</th><th>Out</th>
    <th class="n">Hours</th><th class="n">Km</th><th>Location</th></tr></thead><tbody>
  ${log.map(a=>{const h=a.outTs?((new Date(a.outTs)-new Date(a.inTs))/36e5).toFixed(1):'—';
    return `<tr><td class="num">${a.date.slice(5)}</td><td>${esc(byId(DB.salesmen,a.salesmanId).name)}</td>
    <td class="num">${fmtTime(a.inTs)}${a.inTs.slice(11,16)>'09:30'?' <span class="tag y">late</span>':''}</td>
    <td class="num">${fmtTime(a.outTs)}</td><td class="n">${h}</td><td class="n">${a.km||'—'}</td>
    <td class="sub num">${a.inLat?a.inLat+', '+a.inLng:'—'}</td></tr>`;}).join('')||'<tr><td colspan="7" class="muted" style="padding:18px">No attendance in this window.</td></tr>'}
  </tbody></table></div></div>`;
}
function workDays(from){let n=0;const d=new Date(from+'T00:00'),e=new Date(today()+'T00:00');
  while(d<=e){if(d.getDay()!==0)n++;d.setDate(d.getDate()+1);}return n;}

/* ==================== stock ==================== */
function vStock(){
  const d=focusDist();
  if(!d)return `<div class="empty"><b>No distributor in scope</b></div>`;
  const rows=stockOf(DB,d), dist=byId(DB.distributors,d);
  const stockVal=rows.reduce((a,r)=>a+r.close*r.sku.ptd,0);
  const sec=DB.orders.filter(o=>o.distId===d&&o.date>=daysAgo(30)).reduce((a,o)=>a+o.total,0);
  const pri=DB.primary.filter(p=>p.distId===d&&p.date>=daysAgo(30)).reduce((a,p)=>a+p.total,0);
  const risk=rows.filter(r=>r.cover<7);
  const os=outstanding(DB,i=>i.distId===d);
  return `<div class="mh"><div><span class="eyebrow">Primary in · secondary out</span><h2>${esc(dist.name)}</h2></div>
    <div class="right">${S.user.role!=='distributor'&&myDists().length>1?
      `<select data-f="dist">${myDists().map(x=>`<option value="${x.id}" ${x.id===d?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}
      <button class="btn g sm" data-act="newPrimary">+ Primary bill</button></div></div>
  ${risk.length?`<div class="note bad"><b>${risk.length} SKU${risk.length>1?'s':''} below 7 days cover</b> — ${risk.map(r=>esc(r.sku.pack)).join(', ')}. Indent before the next beat cycle.</div>`:''}
  <div class="kpis">
    <div class="kpi acc"><div class="k">Stock on hand</div><div class="v">${inrS(stockVal)}</div><div class="s">at PTD</div></div>
    <div class="kpi"><div class="k">Primary 30d</div><div class="v">${inrS(pri)}</div><div class="s">mill → distributor</div></div>
    <div class="kpi"><div class="k">Secondary 30d</div><div class="v">${inrS(sec)}</div><div class="s">distributor → retail</div></div>
    <div class="kpi ${os.total?'warn':''}"><div class="k">Outstanding</div><div class="v">${inrS(os.total)}</div><div class="s">${dist.creditDays}d credit terms</div></div>
  </div>
  <div class="card flush"><div class="ch"><b>Stock ledger</b><span class="tag">cover vs 30-day offtake</span></div>
  <div class="scroll"><table class="tbl"><thead><tr><th>SKU</th><th class="n">In</th><th class="n">Out</th><th class="n">Closing</th>
    <th class="n">Per day</th><th>Days cover</th><th class="n">Value</th></tr></thead><tbody>
  ${rows.map(r=>{const p=Math.min(100,r.cover/21*100),c=r.cover<7?'low':r.cover<14?'mid':'';
    return `<tr><td><b>${esc(r.sku.name)}</b><div class="sub">${esc(r.sku.pack)}</div></td>
    <td class="n">${r.inQ}</td><td class="n">${r.outQ}</td>
    <td class="n" style="font-weight:600;${r.close<0?'color:var(--red)':''}">${r.close}</td>
    <td class="n">${r.rate.toFixed(1)}</td>
    <td style="min-width:110px"><div class="num" style="font-size:11px">${r.cover>=99?'—':r.cover.toFixed(0)+'d'}</div>
      <div class="bar"><i class="${c}" style="width:${p}%"></i></div></td>
    <td class="n">${inrS(r.close*r.sku.ptd)}</td></tr>`;}).join('')}
  </tbody></table></div></div>
  <div class="card flush"><div class="ch"><b>Primary bills</b><span class="tag">latest 8</span></div>
  ${DB.primary.filter(p=>p.distId===d).slice(-8).reverse().map(p=>
    `<div class="row"><div class="m"><div class="t">${p.date}</div><div class="s">${p.lines.length} SKUs · ${p.lines.reduce((a,l)=>a+l.qty,0)} packs</div></div>
     <div class="r num" style="font-weight:600">${inr(p.total)}</div></div>`).join('')||'<div class="empty">No primary bills yet.</div>'}</div>`;
}

function login(userId){
  S.user=byId(DB.users,userId);

  DB.session=userId;save();
  document.getElementById('login').classList.add('hide');

  const q={};if(existing)existing.lines.forEach(l=>q[l.skuId]=l.qty);
  const due=outletDue(DB,outletId);
  const over=due>o.creditLimit;
  const body=`
    <div class="card" style="margin-bottom:10px"><div style="display:flex;gap:10px;align-items:flex-start">
      <div style="flex:1"><div style="font-weight:700">${esc(o.name)}</div>
        <div class="muted">${esc(o.area)} · ${esc(byId(DB.distributors,o.distId).name)}</div>
        <div class="muted" style="margin-top:3px">Outstanding ${inr(due)} of ${inr(o.creditLimit)} limit</div></div>
      <button class="btn ghost sm" data-noorder>No order</button></div>
      ${over?`<div class="note bad" style="margin:10px 0 0">Credit limit exceeded by ${inr(due-o.creditLimit)}. Collect before booking, or book and flag for approval.</div>`:''}
    </div>
    <div class="card" id="lines">${DB.skus.map(s=>`
      <div class="ol"><div class="m"><div class="t">${esc(s.name)} <span class="muted">${esc(s.pack)}</span></div>
        <div class="s">PTR <span class="num">${inr(s.ptr)}</span> · MRP <span class="num">${inr(s.mrp)}</span></div>
        <div class="sch" data-sch="${s.id}"></div></div>
        <div class="step"><button data-m="${s.id}">−</button>
        <input class="num" data-q="${s.id}" value="${q[s.id]||0}" inputmode="numeric">
        <button data-p="${s.id}">+</button></div></div>`).join('')}</div>
    <div id="schBox"></div>
    <div class="totbar" style="position:static"><div><div class="l">Net order value</div>

      if(e.target.hasAttribute('data-book')){

          put('order',ord);
          const inv=DB.invoices.find(i=>i.orderId===ord.id);if(inv){inv.amount=Math.round(r.net);put('invoice',inv);}
        }else{
          ord={id:uid('or'),date:today(),outletId,salesmanId:o.salesmanId,distId:o.distId,
            lines:r.lines,gross:r.gross,disc:r.disc,total:r.net,schemes:r.applied,status:'booked'};
          DB.orders.push(put('order',ord));

          DB.invoices.push(put('invoice',{id:uid('in'),date:today(),outletId,distId:o.distId,orderId:ord.id,
            amount:Math.round(r.net),due:iso(new Date(Date.now()+cd*864e5)),paid:0}));
        }
        logVisit(outletId,'order');save();closeSheet();showParchi(ord);render();
      }
    });
    b.addEventListener('input',upd);upd();
  });
}
function logVisit(outletId,status){
  const o=byId(DB.outlets,outletId);

    if(v){v.lat=p.lat;v.lng=p.lng;put('visit',v);geoBlocked=null;save();}},m=>{geoBlocked=m;});
  save();
}
function inFrame(){try{return window.self!==window.top;}catch(e){return true;}}
function localFile(){return location.protocol==='file:'||location.protocol==='content:';}
function geoMsg(e){
  if(e&&e.code===1){
    if(localFile())return 'This page is open as a local file. Browsers refuse location to file:// pages — there is no website identity to attach the permission to, so no address-bar icon appears. Serve it over https or localhost instead.';
    if(inFrame())return 'Location is blocked inside this preview. Download the file and open it in a browser tab.';
    return 'Location permission denied for this site. Reset it from the icon in the address bar, or check that location is switched on for the browser in your device settings.';
  }
  if(e&&e.code===2)return 'No location fix available. Move outdoors or turn on device GPS.';
  if(e&&e.code===3)return 'Location timed out. Try again with a clearer view of the sky.';
  return 'Location could not be read.';
}
function geo(cb,onErr){
  const fail=m=>{ if(onErr)onErr(m); else toast(m); };
  if(!navigator.geolocation)return fail('This browser has no location support.');
  if(!window.isSecureContext)return fail('Location needs a secure page (https or localhost).');
  navigator.geolocation.getCurrentPosition(
    p=>cb({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy||0)}),
    e=>fail(geoMsg(e)),
    {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
function parseLatLng(s){
  if(!s)return null;
  let m=s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)            // maps /@lat,lng
    ||s.match(/[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)          // ?q=lat,lng
    ||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)              // !3dlat!4dlng
    ||s.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);    // plain pair
  if(!m)return null;
  const lat=+m[1],lng=+m[2];
  if(Math.abs(lat)>90||Math.abs(lng)>180)return null;
  return {lat:+lat.toFixed(5),lng:+lng.toFixed(5)};
}
function geoVerdict(){
  if(!navigator.geolocation)return ['bad','This browser has no location support. Enter coordinates by hand.'];
  if(localFile())return ['bad','Opened as a local file. This is the blocker — location will never be granted to a file:// page, however the permissions are set. Serve the file over localhost or https and it will start working.'];
  if(inFrame())return ['bad','Running inside a frame. Preview panels are sandboxed and location is refused. Open the file as its own browser tab.'];
  if(!window.isSecureContext)return ['bad','Not a secure page. Location needs https or localhost.'];
  return ['ok','This setup can receive location. If it still fails, the permission was denied for this site, or location is off in your device settings.'];
}
function geoDiag(){
  const [v,msg]=geoVerdict();
  const rows=[
    ['Page address',location.protocol+'//'+(location.host||'local file')],
    ['Secure page',window.isSecureContext?'yes':'no'],
    ['Inside a frame',inFrame()?'yes':'no'],
    ['Location API',navigator.geolocation?'available':'missing']
  ];
  const body=`<div class="note ${v==='ok'?'':'bad'}"><b>${v==='ok'?'Setup looks fine':'Location cannot work here'}</b><br>${esc(msg)}</div>
    <div class="card flush">${rows.map(([k,val])=>
      `<div class="row"><div class="m"><div class="t">${k}</div></div><div class="r muted">${esc(val)}</div></div>`).join('')}
      <div class="row"><div class="m"><div class="t">Permission state</div></div><div class="r muted" id="permState">checking…</div></div></div>
    <button class="btn g wide" id="tryGeo">Test location now</button>
    <div id="geoOut" class="muted" style="margin-top:10px"></div>
    <div class="card" style="margin-top:12px"><h3>Getting a real address</h3>
      <div class="muted" style="line-height:1.6">
      <b>Quickest test —</b> in the folder holding this file run <span class="num">python3 -m http.server 8000</span>, then open <span class="num">http://localhost:8000/sharda-field.html</span>. Localhost counts as secure, so GPS works.<br><br>
      <b>For the field —</b> salesmen need it on their own phones over https. Any static host works: Cloudflare Pages, Netlify, GitHub Pages. Upload this one file and share the link.<br><br>
      Until then, coordinates can be typed or pasted from a Google Maps link on every outlet record, and attendance still logs the time.</div></div>`;
  sheet('Location access',body,b=>{
    const out=b.querySelector('#geoOut');
    if(navigator.permissions&&navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'})
        .then(r=>{b.querySelector('#permState').textContent=r.state;})
        .catch(()=>{b.querySelector('#permState').textContent='not reported';});
    }else b.querySelector('#permState').textContent='not reported';
    b.querySelector('#tryGeo').onclick=()=>{
      out.textContent='Asking the browser…';
      geo(p=>{out.innerHTML=`<span style="color:var(--greenD);font-weight:600">Got it — ${p.lat}, ${p.lng} (±${p.acc} m)</span>`;},
          m=>{out.innerHTML=`<span style="color:var(--red);font-weight:600">${esc(m)}</span>`;});
    };
  });
}

       return `<div class="f"><label>${esc(s.name)} ${esc(s.pack)}</label><input class="num" data-ts="${s.id}" value="${t?t.qty:0}" inputmode="numeric"></div>`;}).join('')}</div>

    b.querySelector('#tv').onclick=()=>{
      b.querySelectorAll('[data-tm]').forEach(i=>{const id=i.dataset.tm;
        let t=DB.targets.find(x=>x.month===mo&&x.salesmanId===id);
        if(!t){t={id:uid('tg'),month:mo,salesmanId:id,skuId:null,value:0,qty:0};DB.targets.push(t);}
        t.value=+i.value||0;put('target',t);});
      b.querySelectorAll('[data-ts]').forEach(i=>{const id=i.dataset.ts;
        let t=DB.targets.find(x=>x.month===mo&&x.skuId===id);
        if(!t){t={id:uid('tg'),month:mo,salesmanId:null,skuId:id,value:0,qty:0};DB.targets.push(t);}
        t.qty=+i.value||0;put('target',t);});
      save();closeSheet();render();toast('Targets saved');};
  });
}

/* ---- simple masters ---- */
function openSimple(kind){
  const cfg={dist:{t:'New distributor',f:[['name','Name'],['area','Area'],['phone','Phone'],['creditDays','Credit days']]},
             man:{t:'New salesman',f:[['name','Name'],['area','Area'],['phone','Phone']]},
             sku:{t:'New product',f:[['name','Product'],['pack','Pack size'],['cat','Category'],['mrp','MRP'],['ptr','PTR'],['ptd','PTD']]}}[kind];
  sheet(cfg.t,cfg.f.map(([k,l])=>`<div class="f"><label>${l}</label><input data-k="${k}"></div>`).join('')+
    `<button class="btn g wide" id="ok">Add</button>`,b=>{
    b.querySelector('#ok').onclick=()=>{
      const r={id:uid(kind)};
      b.querySelectorAll('[data-k]').forEach(i=>{const v=i.value.trim();r[i.dataset.k]=(v!==''&&!isNaN(v))?+v:v;});
      if(!r.name)return toast('Name is required');
      if(kind==='dist'){r.asmId=DB.asms[0]?.id;DB.distributors.push(put('distributor',r));}
      if(kind==='man'){r.asmId=DB.asms[0]?.id;DB.salesmen.push(put('salesman',r));}
      if(kind==='sku'){r.kg=parseFloat(r.pack)||1;DB.skus.push(put('sku',r));}
      save();closeSheet();render();toast('Added');};
  });
}

/* ==================== csv ==================== */
function csv(name,rows){
  const s=rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
  dl(name,new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));
  toast(name+' downloaded');
}
function dl(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
const EXPORT={
  exportOrders(){const r=[['Date','Outlet','Market','Distributor','Salesman','Product','Pack','Qty','Free','Rate','Gross','Scheme discount','Scheme']];
    myOrders().forEach(o=>o.lines.forEach(l=>{const s=byId(DB.skus,l.skuId),ot=byId(DB.outlets,o.outletId);
      r.push([o.date,ot.name,ot.area,byId(DB.distributors,o.distId).name,byId(DB.salesmen,o.salesmanId).name,
        s.name,s.pack,l.qty,l.free||0,l.rate,l.qty*l.rate,l.disc||0,l.scheme||'']);}));
    csv('orders.csv',r);},
  exportAgeing(){const os=outstanding(DB,i=>sc().outlets.includes(i.outletId));
    csv('outstanding-ageing.csv',[['Bill','Date','Due','Age days','Outlet','Distributor','Amount','Paid','Balance','Overdue']]
      .concat(os.list.map(i=>[i.id.slice(-5).toUpperCase(),i.date,i.due,i.age,byId(DB.outlets,i.outletId).name,
        byId(DB.distributors,i.distId).name,i.amount,i.paid,i.bal,i.overdue?'YES':''])));},
  exportOutlets(){csv('outlets.csv',[['Outlet','Owner','Phone','Market','Type','Beat','Distributor','Salesman','Credit limit','Outstanding','GST','Lat','Lng']]
    .concat(myOutlets().map(o=>[o.name,o.owner,o.phone,o.area,o.type,o.beat,byId(DB.distributors,o.distId).name,
      byId(DB.salesmen,o.salesmanId).name,o.creditLimit,outletDue(DB,o.id),o.gst,o.lat,o.lng])));},
  exportStock(){const r=[['Distributor','Product','Pack','Primary in','Secondary out','Closing','Per day','Days cover','Value at PTD']];
    myDists().forEach(d=>stockOf(DB,d.id).forEach(x=>r.push([d.name,x.sku.name,x.sku.pack,x.inQ,x.outQ,x.close,
      x.rate.toFixed(2),x.cover>=99?'':x.cover.toFixed(1),Math.round(x.close*x.sku.ptd)])));
    csv('stock-position.csv',r);},
  exportAtt(){csv('attendance.csv',[['Date','Salesman','Punch in','Punch out','Hours','Km','Lat','Lng']]
    .concat(DB.attendance.filter(a=>sc().men.includes(a.salesmanId)).map(a=>[a.date,byId(DB.salesmen,a.salesmanId).name,
      fmtTime(a.inTs),fmtTime(a.outTs),a.outTs?((new Date(a.outTs)-new Date(a.inTs))/36e5).toFixed(2):'',a.km,a.inLat,a.inLng])));},
  exportPjp(){const r=[['Salesman','Date','Day','Planned calls','Completed','Deviations','Adherence %']];
    myMen().forEach(m=>pjpMonth(DB,m.id,S.month).forEach(c=>{if(c.sun||c.future)return;
      r.push([m.name,c.date,dayName(c.date),c.plan,c.done,c.dev,pct(c.done,c.plan)]);}));
    csv('journey-plan.csv',r);},
  exportClaims(){csv('scheme-claims.csv',[['Distributor','Month','Orders','Gross','Discount','Free goods value','Total claim']]
    .concat(claims(DB,S.month).filter(c=>sc().dists.includes(c.dist.id))
      .map(c=>[c.dist.name,S.month,c.orders,Math.round(c.gross),c.disc,Math.round(c.freeVal),Math.round(c.total)])));},
  exportColl(){csv('collections.csv',[['Date','Outlet','Bill','Mode','Collected by','Amount']]
    .concat(DB.collections.filter(c=>sc().outlets.includes(c.outletId))
      .map(c=>[c.date,byId(DB.outlets,c.outletId).name,c.invoiceId?c.invoiceId.slice(-5).toUpperCase():'on account',
        c.mode,byId(DB.salesmen,c.salesmanId).name||'',c.amount])));}
};

/* ==================== events ==================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-login],[data-tab],[data-day],[data-act],[data-close],[data-setup],[data-order-for],[data-edit],[data-slip],[data-collect],[data-godist],[data-togglescheme],[data-del]');
  if(!t)return;
  const d=t.dataset;
  if(d.close!==undefined)return closeSheet();
  if(d.login)return closeSheet(),login(d.login);
  if(d.tab){S.tab=d.tab;closeSheet();return render();}
  if(d.day){S.day=d.day;return render();}
  if(d.setup){S.setup=d.setup;return render();}
  if(d.orderFor)return openOrder(d.orderFor);
  if(d.edit)return openOutlet(d.edit);
  if(d.slip)return showParchi(byId(DB.orders,d.slip));
  if(d.collect)return openCollection(d.collect);
  if(d.godist){S.dist=d.godist;S.tab='stock';return render();}
  if(d.togglescheme){const s=byId(DB.schemes,d.togglescheme);s.active=!s.active;put('scheme',s);save();return render();}
  if(d.del){const [k,id]=d.del.split(':');
    if(k==='sku'&&confirm('Remove this product?')){put('sku',byId(DB.skus,id),true);DB.skus=DB.skus.filter(x=>x.id!==id);save();render();}
    return;}
  const a=d.act;
  if(EXPORT[a])return EXPORT[a]();
  ({
    logout,more:moreMenu,switch:switchUser,print:()=>window.print(),geoDiag,sync:openSync,syncNow:()=>Sync.run(),
    newOutlet:()=>openOutlet(null),newPrimary:openPrimary,newColl:()=>openCollection(null),
    newScheme:openScheme,setTargets:openTargets,newDist:()=>openSimple('dist'),
    newMan:()=>openSimple('man'),newSku:()=>openSimple('sku'),
    punchIn:()=>{const m=focusMan();
      DB.attendance.push(put('attendance',{id:uid('at'),date:today(),salesmanId:m,inTs:new Date().toISOString(),outTs:null,km:0}));
      geo(p=>{const a=attToday(DB,m);if(a){a.inLat=p.lat;a.inLng=p.lng;put('attendance',a);geoBlocked=null;save();render();}},
          m2=>{geoBlocked=m2;toast(m2);render();});
      save();render();toast('Punched in');},
    punchOut:()=>{const a=attToday(DB,focusMan());if(!a)return;
      a.outTs=new Date().toISOString();put('attendance',a);save();render();toast('Day closed');},
    backup:()=>{dl('sharda-field-backup-'+today()+'.json',new Blob([JSON.stringify(DB)],{type:'application/json'}));toast('Backup downloaded');},
    restore:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';
      i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
        r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.skus)throw 0;DB=d;save();render();toast('Backup restored');}
          catch(err){toast('That file could not be read');}};r.readAsText(f);};i.click();},
    reset:()=>{if(!confirm('Replace everything with fresh demo data?'))return;
      const u=DB.session;DB=seed();DB.session=u;save();render();toast('Demo data reset');}
  }[a]||(()=>{}))();
});
document.addEventListener('change',e=>{
  const f=e.target.dataset.f;
  if(f==='me'){S.me=e.target.value||null;return render();}
  if(f==='dist'){S.dist=e.target.value||null;return render();}
  if(f==='range'){S.range=+e.target.value;return render();}
  if(f==='month'){S.month=e.target.value;return render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();
    const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(p,p);}}
  if(e.target.dataset.sku){const s=byId(DB.skus,e.target.dataset.sku);s[e.target.dataset.fld]=+e.target.value||0;put('sku',s);save();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ==================== boot ==================== */
(async function(){
  DB=await Store.load();
  if(!DB||DB.v!==2||!DB.skus){DB=seed();await Store.save(DB);}
  DB.settings=DB.settings||{brand:'Sharda Bhog',company:'Sharda Fresh Foods Pvt Ltd'};
  DB.outbox=DB.outbox||[];
  renderLogin();
  if(DB.session&&byId(DB.users,DB.session).id)login(DB.session);
  setInterval(()=>{if(Sync.configured()&&(DB.outbox||[]).length)Sync.run(true);},60000);
  window.addEventListener('online',()=>{if(Sync.configured())Sync.run(true);});
})();
</script>
