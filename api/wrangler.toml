name = "field-assist"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "sharda-field"
database_id = "7fcabaab-952c-4892-83c3-e620b3221122"   # printed by: wrangler d1 create sharda-field

[vars]
ALLOWED_ORIGIN = "*"   # tighten to your Pages URL once deployed

# Secrets are NOT set here. Set them with wrangler secret put:
#   AUTH_SECRET  - signs login tokens (any long random string)
#   ADMIN_KEY    - guards /api/admin/* endpoints
#   PIN_SALT     - salts PIN hashes; must stay "sharda" if you use the seeded PINs
